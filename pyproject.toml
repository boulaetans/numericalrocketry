[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "numericalrocketry"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pillow>=11.0",
    "scipy>=1.13",
    "plotly>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
